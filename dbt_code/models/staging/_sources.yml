sources:
  - name: raw_data
    database: raw
    schema: public
    config:
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 48, period: hour}
      loaded_at_field: _loaded_at
    tables:
      - name: customers
        description: Raw customer records from the transactional system.
        config:
          loaded_at_field: created_at
      - name: orders
        description: Raw order headers.
        config:
          loaded_at_field: order_date
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
      - name: payments
        description: Raw payment transactions linked to orders.
        config:
          freshness: null
      - name: products
        description: Product catalog.
        config:
          freshness: null
      - name: line_items
        description: Order line items with quantity, price, and discount.
        config:
          freshness: null
      - name: web_events
        description: Semi-structured JSON web analytics events (VARIANT payload).
        config:
          loaded_at_field: received_at
